server:
  port: 8080

spring:
  application:
    name: collabflow-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/collabflow
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.springframework: INFO
    com.astitva.collabflow: DEBUG

app:
  jwt:
    secret: 0123456789012345678901234567890123456789012345678901234567890123
    expiration-ms: 86400000