services:
  collabflow-postgres:
    image: postgres:16
    container_name: collabflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: collabflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - collabflow_postgres_data:/var/lib/postgresql/data

volumes:
  collabflow_postgres_data: